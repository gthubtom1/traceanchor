name: Engineering qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Real Windows suite, finite demo and engineering baselines
        run: python -I -B tools/qualify.py --samples 3
      - name: Build wheel and source archive with stdlib backend
        run: python -I -B _build.py dist
      - name: Isolated artifact install, documentation and maintenance journey
        run: python -I -B tools/install_journey.py --output docs/install-qualification.json
      - name: Audit shipped artifact content
        run: python -I -B tools/public_audit.py --artifacts
      - name: Preserve qualification and build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-python-${{ matrix.python }}
          path: |
            docs/qualification.json
            docs/install-qualification.json
            docs/public-audit.json
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: warn

  linux-static:
    name: Linux static and portable unit checks (not dynamic qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Static and portable suite; retain all dynamic skips
        run: python -I -B tools/qualify.py --static-only
      - name: Preserve explicitly limited Linux result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-static-python-3.12
          path: docs/qualification.json
          if-no-files-found: warn
